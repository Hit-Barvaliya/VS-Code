<html>
  <head>
    <link rel="stylesheet" href="feedback.css">

   <script>
      window.onload = function() {
        const form = document.querySelector("form");

        form.addEventListener("submit", function(e) {
          e.preventDefault(); 
          
          const name = document.getElementById("name").value.trim();
          const email = document.querySelector("input[type='email']").value.trim();
          const experience = document.querySelector("select[name='experience']").value;
          const feedback = document.querySelector("textarea").value.trim();

          if (name === "" || email === "" || experience === "select" || feedback === "") {
            alert("Please fill out all fields properly.");
            return;
          }

          const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
          if (!email.match(emailPattern)) {
            alert("Please enter a valid email address.");
            return;
          }

          alert("Thank you for your feedback, " + name + "!");

          form.reset();
        });
      };
</script>


  </head>
  <body>

            <!-- E mail Address :- <br> -->
